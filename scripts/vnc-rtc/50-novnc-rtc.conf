    # ---- noVNC over WebRTC DataChannel: /vnc-rtc ----
    # 页面是 novnc-new 的副本，只把传输层换成 RTCDataChannel；现有 /new_vnc 一个字不动。
    location /vnc-rtc/ {
        alias /usr/share/novnc-rtc/;
        index vnc.html;
        add_header Cache-Control "no-cache";
    }
    location = /vnc-rtc {
        return 302 /vnc-rtc/vnc.html?autoconnect=true&reconnect=true;
    }
    # WebRTC 信令（只监听 127.0.0.1:6091）
    location /rtc/api/ {
        proxy_pass http://127.0.0.1:6091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }
