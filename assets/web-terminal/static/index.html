<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e28;
    --tab-bg: #232736;
    --accent: #19a97b;
    --text: #e6e6e6;
    --muted: #8a90a3;
    --danger: #e05555;
    --border: #2c3145;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 14px; flex: 0 0 auto;
  }
  header .logo { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  header .logo small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  #status {
    font-size: 12px; padding: 2px 10px; border-radius: 10px; background: #3a3320;
    color: #ffb54d; flex: 0 0 auto; white-space: nowrap;
  }
  #status.ok { background: #1d3b31; color: var(--accent); }
  header .spacer { flex: 1; }
  header .hint {
    font-size: 12px; color: var(--muted); min-width: 0;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #navtoggle {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; flex: 0 0 auto;
  }
  #navtoggle:hover, #navtoggle.on { color: var(--accent); border-color: var(--accent); }

  /* ---- layout switcher: 横排 (tabs) / 宫格 (grid) / 分组 (grouped) ---- */
  #layoutsw {
    display: flex; flex: 0 0 auto; border: 1px solid var(--border);
    border-radius: 7px; overflow: hidden;
  }
  #layoutsw button {
    background: transparent; border: 0; border-left: 1px solid var(--border);
    color: var(--muted); font-size: 12px; padding: 4px 10px; cursor: pointer;
  }
  #layoutsw button:first-child { border-left: 0; }
  #layoutsw button:hover { color: var(--text); }
  #layoutsw button.on { background: var(--accent); color: #08130f; font-weight: 600; }
  #gridcols {
    display: none; flex: 0 0 auto; font-size: 12px; padding: 3px 6px;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); border-radius: 7px;
  }
  #gridcols.show { display: block; }
  /* 宫格-only helpers: fill/empty the wall (same look as the column picker) */
  #gridacts { display: none; flex: 0 0 auto; gap: 6px; }
  #gridacts.show { display: flex; }
  #gridacts button {
    font-size: 12px; padding: 4px 10px; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); border-radius: 7px; white-space: nowrap;
  }
  #gridacts button:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- left navigation: opencode sessions ---- */
  #shell { flex: 1 1 auto; display: flex; min-height: 0; }
  #nav {
    flex: 0 0 264px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  #nav.hidden { display: none; }
  .nav-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .nav-title { font-size: 12px; color: var(--muted); letter-spacing: .4px; flex: 1; }
  #nav-refresh {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 13px;
    line-height: 1; padding: 0;
  }
  #nav-refresh:hover { color: var(--accent); border-color: var(--accent); }
  #nav-refresh.spin { animation: navspin .8s linear infinite; }
  @keyframes navspin { to { transform: rotate(360deg); } }
  .nav-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; min-height: 0; }
  .nav-item {
    padding: 7px 9px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .nav-item:hover { background: var(--tab-bg); border-color: var(--border); }
  .nav-item.active { border-color: var(--accent); background: var(--tab-bg); }
  .nav-item-title {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; }
  .nav-item-meta .dir { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-info { padding: 14px 10px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  .nav-info.error { color: var(--danger); word-break: break-all; }
  .nav-foot {
    padding: 6px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); flex: 0 0 auto;
  }
  .nav-list::-webkit-scrollbar { width: 8px; }
  .nav-list::-webkit-scrollbar-thumb { background: #333a4f; border-radius: 4px; }

  #work { flex: 1 1 auto; display: flex; min-width: 0; min-height: 0; }
  #workmain { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ---- group rail: 分组 layout only (auto groups from cwd / opencode dir) ---- */
  #groups {
    flex: 0 0 236px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  #groups.hidden { display: none; }
  .g-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .g-title { font-size: 12px; color: var(--muted); letter-spacing: .4px; flex: 1; }
  .g-count { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
  .g-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; min-height: 0; }
  .g-list::-webkit-scrollbar { width: 8px; }
  .g-list::-webkit-scrollbar-thumb { background: #333a4f; border-radius: 4px; }
  .g-item {
    padding: 7px 9px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .g-item:hover { background: var(--tab-bg); border-color: var(--border); }
  .g-item.active { border-color: var(--accent); background: var(--tab-bg); }
  .g-name {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g-meta {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .g-info { padding: 14px 10px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  .g-foot {
    padding: 6px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); flex: 0 0 auto;
  }

  /* ---- tab bar ---- */
  #tabbar {
    display: flex; align-items: flex-end; gap: 2px; overflow-x: auto;
    background: var(--panel); padding: 6px 10px 0 10px; flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 14px; border-radius: 8px 8px 0 0;
    background: var(--tab-bg); color: var(--muted);
    cursor: pointer; white-space: nowrap; user-select: none;
    border: 1px solid transparent; border-bottom: none;
    font-size: 13px; max-width: 220px;
  }
  .tab .label { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .tab .close {
    width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 50%; color: var(--muted); font-size: 13px; flex: 0 0 auto;
  }
  .tab .close:hover { background: var(--danger); color: #fff; }
  .tab.active {
    background: var(--bg); color: var(--text);
    border-color: var(--border); position: relative;
  }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--accent);
  }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .tab.dead .dot { background: var(--danger); }
  #newtab {
    flex: 0 0 auto; margin-left: 6px; margin-bottom: 5px;
    width: 26px; height: 26px; border-radius: 6px; border: 1px dashed var(--muted);
    background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
  }
  #newtab:hover { color: var(--accent); border-color: var(--accent); }
  /* overflow bucket: the tabs that do not fit (and, in 分组 layout, the other
     groups' terminals) are listed behind this button */
  #tabmore {
    display: none; flex: 0 0 auto; margin-left: 6px; margin-bottom: 5px;
    height: 26px; padding: 0 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--tab-bg);
    color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #tabmore.show { display: inline-block; }
  #tabmore:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- terminal panes ---- */
  #panes { flex: 1 1 auto; position: relative; background: var(--bg); min-height: 0; }
  .pane { position: absolute; inset: 12px; display: none; flex-direction: column; }
  .pane.on { display: flex; }              /* visibility (single mode: the focused pane) */
  .pane.active { /* focused pane; ring only applies inside a split */ }

  /* ---- 宫格 layout: every terminal gets a grid cell (no tab switching) ---- */
  #panes.grid-mode {
    display: grid; gap: 10px; padding: 10px; overflow: auto;
    grid-auto-rows: minmax(140px, 1fr);
  }
  #panes.grid-mode .pane {
    position: relative; inset: auto; display: none;
    min-width: 0; min-height: 0; padding: 8px; overflow: hidden;
    border: 1px solid var(--border); border-radius: 8px;
  }
  #panes.grid-mode .pane.on { display: flex; }
  #panes.grid-mode .pane.active {
    border-color: var(--accent); box-shadow: 0 0 0 1px rgba(25, 169, 123, .35);
  }
  #panes.grid-mode .pane-tools { padding-bottom: 4px; }
  /* no splitting in 宫格 / 分组: the layout itself decides where panes go */
  #panes.grid-mode .split-tool, #panes.group-mode .split-tool { display: none; }
  /* 宫格: this cell comes off the wall (the terminal itself stays open) */
  #panes.grid-mode .wall-tool { display: inline-block; }
  .wall-tool { display: none; }
  .pane-term { flex: 1 1 auto; min-height: 0; position: relative; }
  .xterm { height: 100%; }
  .xterm .xterm-viewport { background: transparent !important; scrollbar-width: thin; }

  /* ---- split layout: a binary tree of panes with draggable dividers ---- */
  .split { position: absolute; inset: 12px; display: flex; min-width: 0; min-height: 0; }
  .split.s-col { flex-direction: column; }
  .split .pane, .split .split {
    position: relative; inset: auto; min-width: 0; min-height: 0;
  }
  .split .pane {
    display: flex; overflow: hidden;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .split .pane.active { border-color: var(--accent); }
  .divider {
    flex: 0 0 8px; position: relative; z-index: 2; touch-action: none;
    background: transparent; border-radius: 4px;
  }
  .divider.d-row { cursor: col-resize; margin: 0 1px; }
  .divider.d-col { cursor: row-resize; margin: 1px 0; }
  .divider:hover, .divider.busy { background: rgba(25, 169, 123, .35); }

  /* tab being dragged + edge drop zones (a pane lights up on the hovered edge) */
  .tab { touch-action: pan-x; }
  .tab.dragging { opacity: .45; }
  .tab.offstage { opacity: .5; }
  /* 宫格: the terminal has a cell on the wall (drag it onto the stage to rearrange) */
  .tab.on-wall { border-color: rgba(25, 169, 123, .55); background: rgba(25, 169, 123, .10); }
  .tab.on-wall .label::before { content: "▦"; color: var(--accent); margin-right: 4px; font-size: 11px; }
  .pane.droptgt::after {
    content: ""; position: absolute; z-index: 6; pointer-events: none;
    background: rgba(25, 169, 123, .22); border: 2px dashed var(--accent); border-radius: 8px;
  }
  .pane.dz-left::after   { left: 2px;  top: 2px;    bottom: 2px; width: 34%; }
  .pane.dz-right::after  { right: 2px; top: 2px;    bottom: 2px; width: 34%; }
  .pane.dz-top::after    { top: 2px;   left: 2px;   right: 2px;  height: 34%; }
  .pane.dz-bottom::after { bottom: 2px;left: 2px;   right: 2px;  height: 34%; }
  /* 宫格: dropping on the middle of a cell replaces the terminal in it */
  .pane.dz-center::after { inset: 2px; }
  .pane.dz-center::before {
    content: "换到这一格"; position: absolute; z-index: 7; pointer-events: none;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 3px 10px; border-radius: 7px; font-size: 12px; color: #08130f;
    background: var(--accent); white-space: nowrap;
  }

  /* ---- per-tab image upload (attaches the image to opencode) ---- */
  .pane-tools {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; padding-bottom: 6px;
  }
  .pane-tool {
    background: var(--tab-bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .pane-tool:hover { color: var(--accent); border-color: var(--accent); }
  .pane-tool.busy { color: var(--accent); border-color: var(--accent); }
  .pane.dragover .pane-term { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .pane.dragover .pane-term::after {
    content: "松开鼠标：把这张图片附加到 opencode";
    position: absolute; inset: 0; z-index: 3; display: flex; align-items: center;
    justify-content: center; background: rgba(18, 20, 26, .8);
    color: var(--accent); font-size: 14px;
  }

  #empty-hint {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); background: var(--bg); z-index: 5;
  }
  #empty-hint button {
    padding: 8px 22px; border-radius: 8px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 14px; cursor: pointer;
  }
  #empty-hint button:hover { background: var(--accent); color: #fff; }

  /* ---- right-click clipboard menu ---- */
  .ctxmenu {
    display: none; position: fixed; z-index: 50; min-width: 132px;
    background: #20242f; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; box-shadow: 0 8px 26px rgba(0, 0, 0, .5);
  }
  .ctxmenu button {
    display: block; width: 100%; text-align: left; padding: 7px 12px;
    background: transparent; border: 0; border-radius: 6px;
    color: var(--text); font-size: 13px; cursor: pointer;
  }
  .ctxmenu button:hover { background: var(--accent); color: #fff; }
  .ctxmenu button.head { color: var(--muted); font-size: 11px; padding: 4px 12px 2px; }
  .ctxmenu button.danger { color: var(--danger); }
  .ctxmenu button.danger:hover { background: var(--danger); color: #fff; }
  .ctxmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* ---- confirm dialog ---- */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 70;
    background: rgba(6, 8, 12, .62); align-items: center; justify-content: center;
  }
  #modal.show { display: flex; }
  .modal {
    width: min(460px, 92vw); background: #20242f; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .6); padding: 18px 18px 14px;
  }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .m-name { font-size: 14px; word-break: break-word; }
  .modal .m-meta { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .modal .m-note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  .modal .m-note:empty { display: none; }
  .modal .m-note.warn { color: #ffb54d; }
  .modal .m-cmd {
    font-family: Menlo, Consolas, monospace; font-size: 11px; color: #9fe0c4;
    background: #161a22; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; margin-top: 10px; word-break: break-all;
  }
  .modal .m-cmd:empty { display: none; }
  .modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal button {
    padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .modal button:hover { border-color: var(--muted); }
  .modal button.primary { background: var(--accent); border-color: var(--accent); color: #08130f; font-weight: 600; }
  .modal button.primary:hover { filter: brightness(1.1); }
  .modal button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .modal button.danger:hover { filter: brightness(1.1); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    background: #20242f; color: var(--text); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="logo">▚ Web Terminal <small>multi-tab</small></div>
  <button id="navtoggle" title="显示 / 隐藏左侧会话导航">☰ 会话</button>
  <span id="status">连接中…</span>
  <div id="layoutsw" title="终端布局（Alt+L 循环切换）">
    <button type="button" data-mode="tabs" title="横排标签：标签超出宽度时自动收进「⋯ 其他终端」下拉">横排</button>
    <button type="button" data-mode="grid" title="宫格平铺：手动拼墙 —— 把标签拖进画面才占一格（拖到格子中间=替换那格，✕ 移出=下墙），点标签也会上墙">宫格</button>
    <button type="button" data-mode="grouped" title="分组：按终端所在目录 / opencode 会话自动分组，左栏选组，标签栏只显示该组">分组</button>
  </div>
  <select id="gridcols" title="宫格列数">
    <option value="0">自动列数</option>
    <option value="1">1 列</option>
    <option value="2">2 列</option>
    <option value="3">3 列</option>
    <option value="4">4 列</option>
  </select>
  <span id="gridacts">
    <button type="button" id="wallall" title="把当前所有终端都放进宫格（最多 9 格）">全部上墙</button>
    <button type="button" id="wallone" title="宫格只留当前终端，其它下墙（终端不关）">只留当前</button>
  </span>
  <div class="spacer"></div>
  <div class="hint">+ 新建 · Alt+N/W · Alt+L 切布局 · Alt+1..9 切终端 · Ctrl+C 复制选区 · Ctrl+V 粘贴 · 右键「复制全部输出」 · TUI 内 Shift+拖选 · 🖼 上传图片：也可拖拽 / 粘贴 · ◫ 分屏：右键选方向 / 拖标签到面板边缘 / 拖中间分隔条调宽度 · 宫格：拖标签进画面=上墙，拖格子中间=替换，✕ 移出=下墙</div>
</header>

<div id="shell">
  <aside id="nav">
    <div class="nav-head">
      <span class="nav-title">opencode 会话</span>
      <button id="nav-refresh" title="刷新列表">⟳</button>
    </div>
    <div id="nav-list" class="nav-list">
      <div class="nav-info">加载中…</div>
    </div>
    <div class="nav-foot"><span id="nav-status">按最后活动时间排序</span></div>
  </aside>

  <div id="work">
    <aside id="groups" class="hidden">
      <div class="g-head">
        <span class="g-title">终端分组</span>
        <span class="g-count" id="g-count"></span>
      </div>
      <div class="g-list" id="g-list"></div>
      <div class="g-foot" id="g-foot">按终端所在目录自动分组</div>
    </aside>

    <div id="workmain">
      <div id="tabbar">
        <button id="tabmore" title="显示其余终端">⋯</button>
        <button id="newtab" title="新建终端 (Alt+N)">+</button>
      </div>
      <div id="panes">
        <div id="empty-hint">
          <div>还没有打开的终端</div>
          <button onclick="newTab()">打开一个终端</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="m-name" id="modal-name"></div>
    <div class="m-meta" id="modal-meta"></div>
    <div class="m-note" id="modal-note"></div>
    <div class="m-cmd" id="modal-cmd"></div>
    <div class="m-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-ok" class="primary"></button>
    </div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/keymap.js"></script>
<script src="/app.js"></script>
</body>
</html>
